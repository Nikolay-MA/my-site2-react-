    <script type="text/javascript">
  // Исправленная версия дешифратора путей для GitHub Pages
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(2).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&') 
      }).join('?');
      window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded ? '/' + decoded : '') + l.hash
      );
    }
  }(window.location));
</script>
